<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Chat Room</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    #input { width: 300px; }
  </style>
</head>
<body>

<h2>WebSocket Room Chat</h2>

<label>Player Name: <input id="playerName" /></label>
<button id="join">Join Room</button>

<div id="chat" style="display:none;">
  <div id="messages"></div>
  <input id="input" placeholder="Type a message" />
  <button id="send">Send</button>
</div>

<script>
let ws;
const roomId = "room1";

const joinBtn = document.getElementById("join");
const playerNameInput = document.getElementById("playerName");
const chatDiv = document.getElementById("chat");
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");

joinBtn.onclick = () => {
  const playerName = playerNameInput.value.trim();
  if (!playerName) return alert("Enter a player name!");

  ws = new WebSocket(`ws://127.0.0.1:8000/ws/${roomId}/${playerName}`);

  ws.onopen = () => {
    console.log("✅ Connected to WebSocket");
    chatDiv.style.display = "block";
  };

  ws.onmessage = (event) => {
    const msg = document.createElement("div");
    msg.textContent = event.data;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  };

  ws.onclose = () => console.log("❌ WebSocket closed");
  ws.onerror = (e) => console.error("⚠️ WebSocket error", e);
};

sendButton.onclick = () => {
  if (input.value.trim() !== "") {
    ws.send(input.value);
    input.value = "";
  }
};

input.addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendButton.click();
});
</script>

</body>
</html>
