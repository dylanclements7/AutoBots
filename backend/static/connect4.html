<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4 Board</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
        }
        
        .board {
            display: inline-grid;
            grid-template-columns: repeat(7, 70px);
            gap: 8px;
            background: #0066cc;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .cell {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.2);
        }
        
        .cell.X {
            background: #ff4444;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.4);
            animation: drop 0.4s ease-out;
        }
        
        .cell.O {
            background: #ffeb3b;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.4);
            animation: drop 0.4s ease-out;
        }
        
        @keyframes drop {
            0% {
                transform: translateY(-500px);
                opacity: 0;
            }
            60% {
                transform: translateY(10px);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .status {
            margin-top: 20px;
            color: white;
            font-size: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        
        .player-info {
            margin-bottom: 20px;
            color: white;
            font-size: 18px;
        }
        
        .turn-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-info">
            <span id="playerSymbol">Waiting...</span>
            <span id="turnIndicator" class="turn-indicator" style="display: none;"></span>
        </div>
        <div class="board" id="board"></div>
        <div class="status" id="status">Connecting...</div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const playerSymbolEl = document.getElementById('playerSymbol');
        const turnIndicatorEl = document.getElementById('turnIndicator');
        
        let mySymbol = '';
        let currentBoard = [];
        
        // Initialize empty board
        function initBoard() {
            boardEl.innerHTML = '';
            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 7; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    boardEl.appendChild(cell);
                }
            }
        }
        
        // Update board display
        function updateBoard(board) {
            currentBoard = board;
            const cells = boardEl.querySelectorAll('.cell');
            
            board.forEach((row, rowIdx) => {
                row.forEach((cell, colIdx) => {
                    const cellIdx = rowIdx * 7 + colIdx;
                    const cellEl = cells[cellIdx];
                    
                    // Remove old classes
                    cellEl.classList.remove('X', 'O');
                    
                    // Add new class if occupied
                    if (cell === 'X') {
                        cellEl.classList.add('X');
                    } else if (cell === 'O') {
                        cellEl.classList.add('O');
                    }
                });
            });
        }
        
        // Listen for messages from parent window
        window.addEventListener('message', (event) => {
            const data = event.data;
            
            if (data.type === 'game_start') {
                mySymbol = data.symbol;
                playerSymbolEl.textContent = `You are: ${mySymbol} (${mySymbol === 'X' ? '🔴 Red' : '🟡 Yellow'})`;
                updateBoard(data.board);
                statusEl.textContent = 'Game started!';
            } 
            else if (data.type === 'board_update') {
                updateBoard(data.gameState || data.board);
                statusEl.textContent = 'Board updated';
            }
            else if (data.type === 'your_turn') {
                updateBoard(data.gameState || data.board);
                statusEl.textContent = '🤖 Your turn! Running bot...';
                turnIndicatorEl.style.display = 'inline-block';
                turnIndicatorEl.style.background = mySymbol === 'X' ? '#ff4444' : '#ffeb3b';
            }
            else if (data.type === 'waiting') {
                statusEl.textContent = "⏳ Opponent's turn...";
                turnIndicatorEl.style.display = 'none';
            }
            else if (data.type === 'game_over') {
                if (data.board) updateBoard(data.board);
                
                let msg = '';
                if (data.winner === 'draw') {
                    msg = '🤝 Game ended in a draw!';
                } else if (data.winner === mySymbol) {
                    msg = '🎉 You won!';
                } else {
                    msg = `😞 You lost. Winner: ${data.winner}`;
                }
                
                statusEl.textContent = msg;
                turnIndicatorEl.style.display = 'none';
            }
            else if (data.type === 'status') {
                statusEl.textContent = data.message;
            }
        });
        
        // Initialize
        initBoard();
        
        // Tell parent we're ready
        window.parent.postMessage({ type: 'board_ready' }, '*');
    </script>
</body>
</html>
