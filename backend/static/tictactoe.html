<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Board</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
        }
        
        .board {
            display: inline-grid;
            grid-template-columns: repeat(3, 120px);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .cell {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: bold;
            cursor: default;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .cell.X {
            color: #e74c3c;
            animation: appear 0.4s ease-out;
        }
        
        .cell.O {
            color: #3498db;
            animation: appear 0.4s ease-out;
        }
        
        .cell.X::before {
            content: '✕';
            position: absolute;
            font-size: 80px;
        }
        
        .cell.O::before {
            content: '○';
            position: absolute;
            font-size: 80px;
        }
        
        .cell.winning {
            background: #f1c40f;
            animation: win-pulse 0.6s ease-in-out infinite;
        }
        
        @keyframes appear {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        
        @keyframes win-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 6px 20px rgba(241, 196, 15, 0.6);
            }
        }
        
        .status {
            margin-top: 25px;
            color: white;
            font-size: 22px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .player-info {
            margin-bottom: 25px;
            color: white;
            font-size: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .turn-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .grid-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-info">
            <span id="playerSymbol">Waiting...</span>
            <span id="turnIndicator" class="turn-indicator" style="display: none;"></span>
        </div>
        <div class="board" id="board"></div>
        <div class="status" id="status">Connecting...</div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const playerSymbolEl = document.getElementById('playerSymbol');
        const turnIndicatorEl = document.getElementById('turnIndicator');
        
        let mySymbol = '';
        let currentBoard = [];
        let winningCells = [];
        
        // Initialize empty board
        function initBoard() {
            boardEl.innerHTML = '';
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    boardEl.appendChild(cell);
                }
            }
        }
        
        // Find winning line
        function findWinningLine(board) {
            // Check rows
            for (let r = 0; r < 3; r++) {
                if (board[r][0] !== ' ' && board[r][0] === board[r][1] && board[r][1] === board[r][2]) {
                    return [[r, 0], [r, 1], [r, 2]];
                }
            }
            
            // Check columns
            for (let c = 0; c < 3; c++) {
                if (board[0][c] !== ' ' && board[0][c] === board[1][c] && board[1][c] === board[2][c]) {
                    return [[0, c], [1, c], [2, c]];
                }
            }
            
            // Check diagonals
            if (board[0][0] !== ' ' && board[0][0] === board[1][1] && board[1][1] === board[2][2]) {
                return [[0, 0], [1, 1], [2, 2]];
            }
            if (board[0][2] !== ' ' && board[0][2] === board[1][1] && board[1][1] === board[2][0]) {
                return [[0, 2], [1, 1], [2, 0]];
            }
            
            return null;
        }
        
        // Update board display
        function updateBoard(board, highlightWin = false) {
            currentBoard = board;
            const cells = boardEl.querySelectorAll('.cell');
            
            // Find winning line if game is over
            const winLine = highlightWin ? findWinningLine(board) : null;
            
            board.forEach((row, rowIdx) => {
                row.forEach((cell, colIdx) => {
                    const cellIdx = rowIdx * 3 + colIdx;
                    const cellEl = cells[cellIdx];
                    
                    // Remove old classes
                    cellEl.classList.remove('X', 'O', 'winning');
                    
                    // Add new class if occupied
                    if (cell === 'X') {
                        cellEl.classList.add('X');
                    } else if (cell === 'O') {
                        cellEl.classList.add('O');
                    }
                    
                    // Highlight winning cells
                    if (winLine) {
                        for (let [r, c] of winLine) {
                            if (r === rowIdx && c === colIdx) {
                                cellEl.classList.add('winning');
                            }
                        }
                    }
                });
            });
        }
        
        // Listen for messages from parent window
        window.addEventListener('message', (event) => {
            const data = event.data;
            
            if (data.type === 'game_start') {
                mySymbol = data.symbol;
                playerSymbolEl.textContent = `You are: ${mySymbol} (${mySymbol === 'X' ? '✕ Red' : '○ Blue'})`;
                updateBoard(data.board || data.gameState);
                statusEl.textContent = 'Game started!';
            } 
            else if (data.type === 'board_update') {
                updateBoard(data.gameState || data.board);
                statusEl.textContent = 'Board updated';
            }
            else if (data.type === 'your_turn') {
                updateBoard(data.gameState || data.board);
                statusEl.textContent = '🤖 Your turn! Running bot...';
                turnIndicatorEl.style.display = 'inline-block';
                turnIndicatorEl.style.background = mySymbol === 'X' ? '#e74c3c' : '#3498db';
            }
            else if (data.type === 'waiting') {
                statusEl.textContent = "⏳ Opponent's turn...";
                turnIndicatorEl.style.display = 'none';
            }
            else if (data.type === 'game_over') {
                const board = data.board || data.gameState;
                if (board) updateBoard(board, true); // Highlight winning line
                
                let msg = '';
                if (data.winner === 'draw') {
                    msg = '🤝 Game ended in a draw!';
                } else if (data.winner === mySymbol) {
                    msg = '🎉 You won!';
                } else {
                    msg = `😞 You lost. Winner: ${data.winner}`;
                }
                
                statusEl.textContent = msg;
                turnIndicatorEl.style.display = 'none';
            }
            else if (data.type === 'status') {
                statusEl.textContent = data.message;
            }
        });
        
        // Initialize
        initBoard();
        
        // Tell parent we're ready
        window.parent.postMessage({ type: 'board_ready' }, '*');
    </script>
</body>
</html>
